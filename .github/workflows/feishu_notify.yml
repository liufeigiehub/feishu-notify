              ["12-12"]="李思成、谢兵阳"
              ["12-13"]="严鑫鑫、孟凡奎"
              ["12-19"]="于国涛、王勇"
              ["12-20"]="刘剑飞、严鑫鑫"
              ["12-26"]="李闯、谢兵阳"
              ["12-27"]="胡海斌、段传俊"
          )

          DAY1_PERSON="${SCHEDULE[$DAY1]:-'待安排'}"
          DAY2_PERSON="${SCHEDULE[$DAY2]:-'待安排'}"

          echo "$DAY1_LABEL值班: $DAY1_PERSON"
          if [ -n "$DAY2_LABEL" ]; then
            echo "$DAY2_LABEL值班: $DAY2_PERSON"
          fi

          # 根据是否有第二天发送不同消息
          if [ -n "$DAY2_LABEL" ]; then
            curl -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{
                "msg_type": "interactive",
                "card": {
                  "header": {
                    "title": {"tag": "plain_text", "content": "值班提醒"},
                    "template": "blue"
                  },
                  "elements": [
                    {
                      "tag": "div",
                      "text": {"tag": "lark_md", "content": "**'"$DAY1_LABEL"' ('"$DAY1"')**\n'"$DAY1_PERSON"'"}
                    },
                    {
                      "tag": "div",
                      "text": {"tag": "lark_md", "content": "**'"$DAY2_LABEL"' ('"$DAY2"')**\n'"$DAY2_PERSON"'"}
                    }
                  ]
                }
              }'
          else
            curl -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{
                "msg_type": "interactive",
                "card": {
                  "header": {
                    "title": {"tag": "plain_text", "content": "值班提醒"},
                    "template": "blue"
                  },
                  "elements": [
                    {
                      "tag": "div",
                      "text": {"tag": "lark_md", "content": "**'"$DAY1_LABEL"' ('"$DAY1"')**\n'"$DAY1_PERSON"'"}
                    }
                  ]
                }
              }'
          fi

          echo "消息已发送: $(date)"
