name: Feishu Notification

# 每2小时执行一次 (UTC时间，北京时间需要减8小时)
# 北京时间: 0:00, 2:00, 4:00, 6:00, 8:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00
# UTC时间: 16:00, 18:00, 20:00, 22:00, 0:00, 2:00, 4:00, 6:00, 8:00, 10:00, 12:00, 14:00

on:
  schedule:
    # 每2小时执行 (UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  send-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Send Feishu Message
        run: |
          curl -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
  "msg_type": "interactive",
  "card": {
    "schema": "2.0",
    "config": {
      "update_multi": true,
      "style": {
        "text_size": {
          "normal_v2": {
            "default": "normal",
            "pc": "normal",
            "mobile": "heading"
          }
        }
      }
    },
    "body": {
      "direction": "vertical",
      "padding": "12px 12px 12px 12px",
      "elements": [
        {
          "tag": "markdown",
          "content": "西湖，位于中国浙江省杭州市西湖区龙井路1号，杭州市区西部，汇水面积为21.22平方千米，湖面面积为6.38平方千米。",
          "text_align": "left",
          "text_size": "normal_v2",
          "margin": "0px 0px 0px 0px"
        },
        {
          "tag": "button",
          "text": {
            "tag": "plain_text",
            "content": "🌞更多景点介绍"
          },
          "type": "default",
          "width": "default",
          "size": "medium",
          "behaviors": [
            {
              "type": "open_url",
              "default_url": "https://baike.baidu.com/item/%E8%A5%BF%E6%B9%96/4668821",
              "pc_url": "",
              "ios_url": "",
              "android_url": ""
            }
          ],
          "margin": "0px 0px 0px 0px"
        }
      ]
    },
    "header": {
      "title": {
        "tag": "plain_text",
        "content": "今日旅游推荐"
      },
      "subtitle": {
        "tag": "plain_text",
        "content": ""
      },
      "template": "blue",
      "padding": "12px 12px 12px 12px"
    }
  }
}'

          echo "消息已发送: $(date)"

      - name: Log Result
        run: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] 飞书消息发送完成"
