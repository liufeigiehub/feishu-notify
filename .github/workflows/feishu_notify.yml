name: Feishu Duty Notification

# 每周二上午10点发送（北京时间）
# 北京时间10:00 = UTC时间02:00
# cron: 0 2 * * 2

on:
  schedule:
    # 周五 UTC 03:00 (北京时间 11:00)
    - cron: '0 3 * * 5'
    # 周六 UTC 03:00 (北京时间 11:00)
    - cron: '0 3 * * 6'
    # 周日 UTC 03:00 (北京时间 11:00)
    - cron: '0 3 * * 0'
  workflow_dispatch:  # 支持手动触发

jobs:
  send-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Get day info
        run: |
          # 获取当前星期几和日期
          WEEKDAY=$(date '+%u')  # 1=周一, 7=周日
          echo "WEEKDAY=$WEEKDAY" >> $GITHUB_ENV

          # 根据星期几计算值班日期
          if [ "$WEEKDAY" == "5" ]; then
            # 周五：提醒周六(+1)和周日(+2)
            DAY1=$(date -d "+1 days" '+%m-%d')
            DAY2=$(date -d "+2 days" '+%m-%d')
            DAY1_LABEL="周六"
            DAY2_LABEL="周日"
          elif [ "$WEEKDAY" == "6" ]; then
            # 周六：提醒当天和周日(+1)
            DAY1=$(date '+%m-%d')
            DAY2=$(date -d "+1 days" '+%m-%d')
            DAY1_LABEL="周六"
            DAY2_LABEL="周日"
          else
            # 周日：只提醒当天
            DAY1=$(date '+%m-%d')
            DAY2=""
            DAY1_LABEL="周日"
            DAY2_LABEL=""
          fi

          echo "DAY1=$DAY1" >> $GITHUB_ENV
          echo "DAY2=$DAY2" >> $GITHUB_ENV
          echo "DAY1_LABEL=$DAY1_LABEL" >> $GITHUB_ENV
          echo "DAY2_LABEL=$DAY2_LABEL" >> $GITHUB_ENV

          echo "值班日期: $DAY1_LABEL $DAY1, $DAY2_LABEL $DAY2"

      - name: Send Feishu Message
        env:
          DAY1: ${{ env.DAY1 }}
          DAY2: ${{ env.DAY2 }}
          DAY1_LABEL: ${{ env.DAY1_LABEL }}
          DAY2_LABEL: ${{ env.DAY2_LABEL }}
        run: |
          # 值班表 - 平均分配版
          declare -A SCHEDULE=(
              ["05-30"]="段传俊、于国涛"
              ["05-31"]="璩诚、李思成"
              ["06-06"]="孟凡奎、胡海斌"
              ["06-07"]="郭成志、谢兵阳"
              ["06-13"]="王毅、李东原"
              ["06-14"]="严鑫鑫、李遥"
              ["06-20"]="王世腾、李闯"
              ["06-21"]="刘剑飞、王勇"
              ["06-27"]="翁弘毅、王勇"
              ["06-28"]="于国涛、刘剑飞"
              ["07-04"]="李东原、郭成志"
              ["07-05"]="段传俊、孟凡奎"
              ["07-11"]="谢兵阳、王世腾"
              ["07-12"]="璩诚、李闯"
              ["07-18"]="王毅、严鑫鑫"
              ["07-19"]="胡海斌、李遥"
              ["07-25"]="李思成、翁弘毅"
              ["07-26"]="谢兵阳、胡海斌"
              ["08-01"]="刘剑飞、郭成志"
              ["08-02"]="李闯、翁弘毅"
              ["08-08"]="璩诚、孟凡奎"
              ["08-09"]="李遥、李思成"
              ["08-15"]="李东原、严鑫鑫"
              ["08-16"]="王毅、于国涛"
              ["08-22"]="段传俊、王勇"
              ["08-23"]="王世腾、王勇"
              ["08-29"]="严鑫鑫、李遥"
              ["08-30"]="李东原、李思成"
              ["09-05"]="段传俊、李闯"
              ["09-06"]="王毅、孟凡奎"
              ["09-12"]="胡海斌、翁弘毅"
              ["09-13"]="郭成志、刘剑飞"
              ["09-19"]="璩诚、于国涛"
              ["09-20"]="王世腾、谢兵阳"
              ["09-26"]="郭成志、李思成"
              ["09-27"]="李遥、胡海斌"
              ["10-03"]="段传俊、王勇"
              ["10-04"]="王世腾、严鑫鑫"
              ["10-10"]="刘剑飞、璩诚"
              ["10-11"]="王毅、李闯"
              ["10-17"]="李东原、谢兵阳"
              ["10-18"]="孟凡奎、翁弘毅"
