name: Feishu Notification

# 每2小时执行一次 (UTC时间，北京时间需要减8小时)
# 北京时间: 0:00, 2:00, 4:00, 6:00, 8:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00
# UTC时间: 16:00, 18:00, 20:00, 22:00, 0:00, 2:00, 4:00, 6:00, 8:00, 10:00, 12:00, 14:00

on:
  schedule:
    # 每2小时执行 (UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  send-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Send Feishu Message
        run: |
          curl -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "interactive",
              "card": {
                "schema": "2.0",
                "config": {
                  "update_multi": true,
                  "style": {
                    "text_size": {
                      "normal_v2": {
                        "default": "normal",
                        "pc": "normal",
                        "mobile": "heading"
                      }
                    }
                  }
                },
                "body": {
                  "direction": "vertical",
                  "padding": "12px 12px 12px 12px",
                  "elements": [
                    {
                      "tag": "markdown",
                      "content": "oi oi oi 阿巴阿巴阿巴",
                      "text_align": "left",
                      "text_size": "normal_v2",
                      "margin": "0px 0px 0px 0px"
                    }
                  ]
                },
                "header": {
                  "title": {
                    "tag": "plain_text",
                    "content": "定时提醒"
                  },
                  "subtitle": {
                    "tag": "plain_text",
                    "content": ""
                  },
                  "template": "blue",
                  "padding": "12px 12px 12px 12px"
                }
              }
            }'

          echo "消息已发送: $(date)"

      - name: Log Result
        run: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] 飞书消息发送完成"
